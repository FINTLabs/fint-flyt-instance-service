fint:
  application-id: fint-flyt-instance-service

springdoc:
  api-docs:
    path: /api/intern/handlinger/instanser/v3/api-docs
  swagger-ui:
    path: /api/intern/handlinger/instanser/swagger-ui.html

novari:
  flyt:
    instance-service:
      time-to-keep-instance-in-days: 60
      kafka:
        topic:
          instance-processing-events-retention-time: "4d"

server:
  error:
    include-message: always

spring:
  profiles:
    include:
      - flyt-kafka
      - flyt-logging
      - flyt-postgres
      - flyt-web-resource-server
  output:
    ansi:
      enabled: always
